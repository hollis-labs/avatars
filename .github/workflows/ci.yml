name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile
        run: python3 -m py_compile avatar.py lib.py prompts.py serve.py

      - name: Dry run (builds the prompt; no key, no spend)
        run: python3 -I avatar.py --dry-run --json --out "$(mktemp -d)" -- ci-check
